name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  ci:
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    uses: captive-studio/captive-ci/.github/workflows/expo-ci.yml@main
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
    with:
      # renovate: datasource=docker depName=node
      node-image: node:lts@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
      lint-command: npm run lint
      typecheck-command: npm run typecheck
      format-check-command: npm run format:check
      test-command: npm run test:unit
      jest-cache-path: packages/components/.jest-cache
      extra-cache-paths: |
        packages/*/node_modules
        apps/*/node_modules
      install-command: npm ci
      health-command: ""
      audit-command: ""

  health:
    name: Health (Expo doctor + Web smoke test)
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted]
    container: node:lts@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            node_modules
            packages/*/node_modules
            apps/*/node_modules
          key: npm-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Ensure dependencies (cache fallback)
        run: test -x node_modules/.bin/tsc || npm ci

      - name: Build workspace packages
        run: npm run build --workspace=packages/core --workspace=packages/theme --workspace=packages/components --workspace=packages/storybook

      - name: Expo doctor
        working-directory: apps/docs
        run: npx expo-doctor

      - name: Web smoke test
        working-directory: apps/docs
        run: |
          set -e
          CI=1 npm run start -- --web > /tmp/web-smoke-test.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          html=""
          for i in $(seq 1 30); do
            html=$(curl -sf http://localhost:8081 2>/dev/null) && [ -n "$html" ] && break
            sleep 2
          done
          if [ -z "$html" ]; then
            echo "::error::Le serveur web ne répond pas après 60s"
            cat /tmp/web-smoke-test.log
            exit 1
          fi

          bundle_path=$(echo "$html" | grep -o 'src="[^"]*entry.bundle[^"]*"' | head -1 | sed 's/src="//; s/"$//')
          if [ -z "$bundle_path" ]; then
            echo "::error::Impossible de trouver l'URL du bundle dans la page HTML"
            echo "$html"
            exit 1
          fi

          http_code=$(curl -s -o /tmp/bundle-response.body -w "%{http_code}" "http://localhost:8081${bundle_path}")
          if [ "$http_code" != "200" ]; then
            echo "::error::Le bundling a échoué (HTTP $http_code)"
            cat /tmp/bundle-response.body
            exit 1
          fi

          echo "Bundle web compilé avec succès (HTTP 200)."

  publish-packages:
    name: Publish packages to npm
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted]
    container: node:lts@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm ci --no-audit --no-fund

      - name: Publish packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: ./scripts/publish-package --ci
