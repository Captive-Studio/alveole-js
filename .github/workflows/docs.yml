name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and deploy docs
    runs-on: [self-hosted]
    container: node:lts@sha256:19cd848a0e073d34bd8cd5545a1b6b4d28489b3e3b607366621ced442bd5f6b4
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build @alveole/core
        run: npm run build --workspace=packages/core

      - name: Build @alveole/theme
        run: npm run build --workspace=packages/theme

      - name: Build @alveole/components
        run: npm run build --workspace=packages/components

      - name: Build @alveole/storybook
        run: npm run build --workspace=packages/storybook

      - name: Build docs
        run: npm run build --workspace=apps/docs

      - name: Disable Jekyll (allow _expo/ assets)
        run: touch apps/docs/dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/docs/dist
          cname: alveole.captive.fr
