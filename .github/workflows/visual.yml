name: Visual Regression

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Régénérer les snapshots de référence Linux et les committer'
        type: boolean
        default: false

jobs:
  visual:
    name: Visual regression tests
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: [self-hosted]
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install dependencies
        run: npm ci

      - name: Debug Metro bundle
        if: inputs.update_snapshots != true
        env:
          CI: true
          EXPO_NO_WATCHMAN: 'true'
        run: |
          npm run start:test --workspace=apps/docs &
          SERVER_PID=$!
          echo "Waiting for Metro..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:8081 > /dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "=== Bundle response ==="
          curl -s "http://localhost:8081/node_modules/expo-router/entry.bundle?platform=web&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.routerRoot=app&unstable_transformProfile=hermes-stable" | head -50
          echo "=== HTTP status ==="
          curl -o /dev/null -w "%{http_code}" "http://localhost:8081/node_modules/expo-router/entry.bundle?platform=web&dev=true&hot=false&lazy=true&transform.engine=hermes&transform.routerRoot=app&unstable_transformProfile=hermes-stable"
          kill $SERVER_PID || true

      - name: Run visual tests
        if: inputs.update_snapshots != true
        env:
          CI: true
        run: npm run test:visual

      - name: Update snapshots
        if: inputs.update_snapshots == true
        env:
          CI: true
        run: npm run test:visual:update

      - name: Commit updated snapshots
        if: inputs.update_snapshots == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/snapshots/
          git diff --cached --quiet || git commit -m "📸 Mise à jour des snapshots visuels Linux"
          git push

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
